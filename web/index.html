<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redline — Mars Circuit</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070304;
        color: #e8d4c4;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        letter-spacing: 0.08em;
        padding: 2rem;
        box-sizing: border-box;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status">Loading Redline…</div>
    <script type="module">
      const boot = document.getElementById("boot");
      try {
        // Check before downloading the game: a blocked WebGL context otherwise
        // fails inside the asynchronously started Rust event loop.
        let gl;
        try {
          gl = document.createElement("canvas").getContext("webgl2", {
            antialias: false,
          });
        } catch {
          // Browsers may throw instead of returning null when WebGL is blocked.
        }
        if (!gl) {
          throw new Error(
            "WebGL 2 is unavailable. Enable hardware acceleration in your browser, " +
              "or try another browser or device.",
          );
        }
        // The game creates its own canvas; release this temporary context.
        gl.getExtension("WEBGL_lose_context")?.loseContext();

        // A static import fails before this try/catch can show a loading error.
        const { default: init } = await import("./pkg/redline.js");
        await init();
        boot?.remove();
      } catch (err) {
        // winit's web EventLoop::run throws after spawning the async
        // loop so the Rust signature can stay `!`. This is intentional.
        const msg = err && (err.message || String(err));
        const controlFlow =
          typeof msg === "string" &&
          msg.startsWith("Using exceptions for control flow,");
        if (controlFlow) {
          boot?.remove();
        } else {
          if (boot) {
            boot.setAttribute("role", "alert");
            boot.textContent =
              "Redline couldn't start.\n\n" +
              (msg || String(err)) +
              "\n\nReload the page to try again.";
            boot.style.pointerEvents = "auto";
          }
          throw err;
        }
      }
    </script>
  </body>
</html>
