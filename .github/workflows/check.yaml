name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.92.0

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Install Xvfb and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers

      - name: Smoke (Xvfb + lavapipe)
        run: xvfb-run -a cargo run --release -- --smoke 20
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          RUST_LOG: info
