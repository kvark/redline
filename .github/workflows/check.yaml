name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.92.0

      - name: Format
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Install Xvfb and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers libxkbcommon0 libxkbcommon-x11-0
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          echo "Using Vulkan ICD $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"

      - name: Smoke debug (Xvfb + lavapipe)
        run: xvfb-run -a cargo run -- --smoke 20
        env:
          RUST_LOG: info
          RUST_BACKTRACE: 1

      - name: Smoke (Xvfb + lavapipe)
        run: xvfb-run -a cargo run --release -- --smoke 20
        env:
          RUST_LOG: info

  wasm:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.92.0

      - name: Check WASM
        run: cargo check --target wasm32-unknown-unknown
